# halftype.app on js (Dokploy compose "halftype-site"); Traefik ends TLS in front of this. deploy.sh copies it up.
server {
  listen 80;
  server_name www.halftype.app;
  return 301 https://halftype.app$request_uri;
}
server {
  listen 80 default_server;
  root /usr/share/nginx/html;
  autoindex off;
  location / { try_files $uri $uri/index.html =404; }
  location ~* \.(png|jpg|svg|css|js|woff2)$ { expires 7d; add_header Cache-Control "public"; }
}
